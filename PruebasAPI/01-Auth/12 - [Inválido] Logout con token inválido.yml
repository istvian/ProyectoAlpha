info:
  name: "[Inválido] Logout con token inválido"
  type: http
  seq: 12
  tags:
    - invalido
    - publico

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/logout"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Cookie", "token=eyJhbGciOiJIUzI1NiJ9.invalid.signature.bruno");
    - type: tests
      code: |-
        test("Logout acepta token inválido con 200", function() {
          expect(res.status).to.equal(200);
        });
        test("Logout confirma cierre de sesión", function() {
          expect(res.body.error).to.equal(false);
          expect(res.body.mensaje).to.equal("Se ha cerrado la sesión correctamente");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
