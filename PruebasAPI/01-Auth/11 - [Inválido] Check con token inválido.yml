info:
  name: "[Inválido] Check con token inválido"
  type: http
  seq: 11
  tags:
    - invalido
    - publico

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/check"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Cookie", "token=eyJhbGciOiJIUzI1NiJ9.invalid.signature.bruno");
    - type: tests
      code: |-
        test("Check con token inválido responde 200", function() {
          expect(res.status).to.equal(200);
        });
        test("Check marca error true", function() {
          expect(res.body.error).to.equal(true);
          expect(res.body.mensaje).to.equal("Token no válido");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
