info:
  name: "[Válido] Registrar conteo físico"
  type: http
  seq: 8
  tags:
    - valido
    - integracion

http:
  method: POST
  url: "{{baseUrl}}/api/v1/inventario/conteos"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json

runtime:
  scripts:
    - type: before-request
      code: |-
        const axios = require("axios");
        const BASE = bru.getEnvVar("baseUrl") || "http://127.0.0.1:8000";
        async function loginCookie(correo) {
          const r = await axios.post(BASE + "/api/v1/users/login", { correo: correo, password: bru.getEnvVar("password") || "Qwerty1234!" });
          const raw = r.headers["set-cookie"];
          const sc = Array.isArray(raw) ? raw.join("; ") : String(raw || "");
          const m = sc.match(/token=([^;]+)/);
          if (!m) { throw new Error("No se pudo obtener token para " + correo); }
          return "token=" + m[1];
        }
        const cookie = await loginCookie("bodega@mail.cl");
        req.setHeader("Cookie", cookie);
        const adminCookie = await loginCookie("admin@mail.cl");

        const cat = await axios.get(BASE + "/api/v1/inventario/conteos/catalogos", { headers: { Cookie: adminCookie } });
        const a = cat.data.data[0];
        if (!a) { throw new Error("Catalogo de conteo vacio"); }
        req.setBody({ observaciones: "Conteo Bruno " + Date.now(), detalles: [{ articulo_id: a.id, stock_sistema: a.stock_actual, cantidad_contada: Math.max(0, a.stock_actual - 1) }] });
    - type: tests
      code: |-
        test("Registrar conteo físico: devuelve 201", function() {
          expect(res.status).to.equal(201);
        });
        test("Respuesta sin error de negocio", function() {
          expect(res.body.error).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
