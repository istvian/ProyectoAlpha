info:
  name: "[Válido] Crear factura"
  type: http
  seq: 2
  tags:
    - valido
    - integracion

http:
  method: POST
  url: "{{baseUrl}}/api/v1/finanzas/factura"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json

runtime:
  scripts:
    - type: before-request
      code: |-
        const axios = require("axios");
        const BASE = bru.getEnvVar("baseUrl") || "http://127.0.0.1:8000";
        async function loginCookie(correo) {
          const r = await axios.post(BASE + "/api/v1/users/login", { correo: correo, password: bru.getEnvVar("password") || "Qwerty1234!" });
          const raw = r.headers["set-cookie"];
          const sc = Array.isArray(raw) ? raw.join("; ") : String(raw || "");
          const m = sc.match(/token=([^;]+)/);
          if (!m) { throw new Error("No se pudo obtener token para " + correo); }
          return "token=" + m[1];
        }
        const cookie = await loginCookie("finanzas@mail.cl");
        req.setHeader("Cookie", cookie);
        const suf = String(Date.now());
        const emision = new Date().toISOString().slice(0, 10);
        const vencimiento = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
        req.setBody({
          tipo: "Factura",
          proveedor: "Proveedor Demo Alpha",
          rut: "99012345-4",
          folio: "BRU-FACT-" + suf,
          emision: emision,
          vencimiento: vencimiento,
          observaciones: "Factura de prueba Bruno",
          productos: [{ nombre: "Articulo Bruno Factura", sku: "BRU-FACT-SKU-" + suf, stock: 1, stock_minimo: 0, precio_neto: 1000 }]
        });
    - type: tests
      code: |-
        test("Crear factura: devuelve 200", function() {
          expect(res.status).to.equal(200);
        });
        test("Respuesta sin error de negocio", function() {
          expect(res.body.error).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
