info:
  name: "[Válido] Actualizar obra"
  type: http
  seq: 8
  tags:
    - valido
    - integracion

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/obras"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json

runtime:
  scripts:
    - type: before-request
      code: |-
        const axios = require("axios");
        const BASE = bru.getEnvVar("baseUrl") || "http://127.0.0.1:8000";
        async function loginCookie(correo) {
          const r = await axios.post(BASE + "/api/v1/users/login", { correo: correo, password: bru.getEnvVar("password") || "Qwerty1234!" });
          const raw = r.headers["set-cookie"];
          const sc = Array.isArray(raw) ? raw.join("; ") : String(raw || "");
          const m = sc.match(/token=([^;]+)/);
          if (!m) { throw new Error("No se pudo obtener token para " + correo); }
          return "token=" + m[1];
        }
        const cookie = await loginCookie("finanzas@mail.cl");
        req.setHeader("Cookie", cookie);
        const adminCookie = await loginCookie("admin@mail.cl");

        const nombre = "Obra Bruno " + Date.now();
        await axios.post(BASE + "/api/v1/obras", { codigo_obra: "OBR-BRUNO", nombre_obra: nombre, tipo_servicio: "Prueba Bruno", tecnico_responsable_mail: "tecnico@mail.cl", enabled: true, fecha_creacion: new Date().toISOString() }, { headers: { Cookie: adminCookie } });
        const obras = await axios.get(BASE + "/api/v1/obras", { headers: { Cookie: adminCookie } });
        const obra = obras.data.data.find(o => o.nombre_obra === nombre);
        if (!obra) { throw new Error("No se encontro la obra creada"); }
        req.setBody({ id: obra.id, codigo_obra: "OBR-BRUNO-PATCH-" + Date.now(), nombre_obra: nombre + " Actualizada", tipo_servicio: "Prueba Funcional", tecnico_responsable_mail: "tecnico@mail.cl", enabled: true, fecha_creacion: new Date().toISOString() });
    - type: tests
      code: |-
        test("Actualizar obra: devuelve 200", function() {
          expect(res.status).to.equal(200);
        });
        test("Respuesta sin error de negocio", function() {
          expect(res.body.error).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
