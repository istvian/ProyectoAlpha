info:
  name: Exportar Cardex PDF
  type: http
  seq: 5

http:
  method: GET
  url: http://127.0.0.1:8000/api/v1/cardex/exportar
  params:
    - name: formato
      value: pdf
      type: query
    - name: desde
      value: "2026-11-01"
      type: query
    - name: hasta
      value: "2026-11-30"
      type: query
    - name: producto_id
      value: "1"
      type: query
    - name: obra_id
      value: "1"
      type: query
    - name: tipo_movimiento
      value: SALIDA_OBRA
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
