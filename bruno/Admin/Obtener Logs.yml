info:
  name: Obtener Logs
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:8000/api/v1/admin/logs?cantidad=20&pagina=2&usuario=&evento=
  params:
    - name: cantidad
      value: "20"
      type: query
    - name: pagina
      value: "2"
      type: query
    - name: usuario
      value: ""
      type: query
    - name: evento
      value: ""
      type: query
    - name: desde
      value: ""
      type: query
      disabled: true
    - name: hasta
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
